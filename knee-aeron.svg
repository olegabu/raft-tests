<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="aeron — still the flattest curve, but the ceiling moved down on c7a">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">aeron — still the flattest curve, but the ceiling moved down on c7a</text>
<text x="78" y="46" font-size="12" fill="#52514e">A 10x change in offered rate, 25k to 250k, moves p50 by 16 µs; 290k steps to 2.1 ms.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
