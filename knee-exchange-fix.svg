<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="exchange-fix - a CLOB on sequencer, over FIX 4.4">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">exchange-fix - a CLOB on sequencer, over FIX 4.4</text>
<text x="78" y="46" font-size="12" fill="#52514e">Full rate to 150k with zero drops, p50 1.4ms / p99 4.5ms. Hollow = offered rate not met.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="78" y="86" width="179.4" height="280" fill="#f0efec"/>
<text x="86" y="102" font-size="11" fill="#898781">comfort zone</text>
<line x1="257.4" y1="86" x2="257.4" y2="366" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="263.4" y="236" font-size="11" font-weight="600" fill="#52514e">last clean</text>
<line x1="311.2" y1="86" x2="311.2" y2="366" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="317.2" y="126" font-size="11" font-weight="600" fill="#52514e">ceiling</text>
<line x1="78" y1="354.7" x2="700" y2="354.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="358.7" font-size="11" fill="#898781" text-anchor="end">1,000</text>
