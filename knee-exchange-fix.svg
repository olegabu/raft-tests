<text x="68" y="239.1" font-size="11" fill="#898781" text-anchor="end">40,000</text>
<line x1="78" y1="192.3" x2="700" y2="192.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="196.3" font-size="11" fill="#898781" text-anchor="end">150,000</text>
<line x1="78" y1="147.4" x2="700" y2="147.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="151.4" font-size="11" fill="#898781" text-anchor="end">600,000</text>
<line x1="78" y1="86.0" x2="700" y2="86.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="90.0" font-size="11" fill="#898781" text-anchor="end">4,000,000</text>
<text x="20" y="226" font-size="11" fill="#52514e" text-anchor="middle" transform="rotate(-90 20 226)">latency (µs), log scale</text>
<line x1="78" y1="366" x2="700" y2="366" stroke="#c3c2b7" stroke-width="1"/>
<line x1="78.0" y1="366" x2="78.0" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="78.0" y="386" font-size="11" fill="#898781" text-anchor="middle">0k</text>
<line x1="197.6" y1="366" x2="197.6" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="197.6" y="386" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="317.2" y1="366" x2="317.2" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="317.2" y="386" font-size="11" fill="#898781" text-anchor="middle">200k</text>
<line x1="436.8" y1="366" x2="436.8" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="436.8" y="386" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="556.5" y1="366" x2="556.5" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="556.5" y="386" font-size="11" fill="#898781" text-anchor="middle">400k</text>
<line x1="676.1" y1="366" x2="676.1" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="676.1" y="386" font-size="11" fill="#898781" text-anchor="middle">500k</text>
<text x="389" y="410" font-size="11" fill="#52514e" text-anchor="middle">offered rate (requests/sec)</text>
