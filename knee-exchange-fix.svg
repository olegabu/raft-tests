<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="exchange-fix - a CLOB on sequencer, over FIX 4.4">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">exchange-fix - a CLOB on sequencer, over FIX 4.4</text>
<text x="78" y="46" font-size="12" fill="#52514e">Zero drops through 150k, p50 ~1ms to 100k, ceiling ~123k. Hollow = offered rate not met.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="78" y="86" width="119.6" height="280" fill="#f0efec"/>
<text x="86" y="102" font-size="11" fill="#898781">comfort zone</text>
<line x1="225.1" y1="86" x2="225.1" y2="366" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="231.1" y="236" font-size="11" font-weight="600" fill="#52514e">ceiling</text>
<line x1="78" y1="354.5" x2="700" y2="354.5" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="358.5" font-size="11" fill="#898781" text-anchor="end">1,000</text>
<line x1="78" y1="318.9" x2="700" y2="318.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="322.9" font-size="11" fill="#898781" text-anchor="end">3,000</text>
<line x1="78" y1="279.9" x2="700" y2="279.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="283.9" font-size="11" fill="#898781" text-anchor="end">10,000</text>
