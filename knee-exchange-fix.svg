<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="exchange-fix - a CLOB on sequencer, over FIX 4.4">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">exchange-fix - a CLOB on sequencer, over FIX 4.4</text>
<text x="78" y="46" font-size="12" fill="#52514e">Full rate to 100k, zero drops, p50 1.1ms and p99 2.1ms at 100k. Hollow = offered rate not met.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="78" y="86" width="565.5" height="280" fill="#f0efec"/>
<text x="86" y="102" font-size="11" fill="#898781">comfort zone</text>
<line x1="78" y1="366.0" x2="700" y2="366.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="370.0" font-size="11" fill="#898781" text-anchor="end">700</text>
<line x1="78" y1="308.9" x2="700" y2="308.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="312.9" font-size="11" fill="#898781" text-anchor="end">900</text>
<line x1="78" y1="263.3" x2="700" y2="263.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="267.3" font-size="11" fill="#898781" text-anchor="end">1,100</text>
<line x1="78" y1="225.3" x2="700" y2="225.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="229.3" font-size="11" fill="#898781" text-anchor="end">1,300</text>
<line x1="78" y1="178.1" x2="700" y2="178.1" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="182.1" font-size="11" fill="#898781" text-anchor="end">1,600</text>
<line x1="78" y1="127.4" x2="700" y2="127.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="131.4" font-size="11" fill="#898781" text-anchor="end">2,000</text>
<line x1="78" y1="86.0" x2="700" y2="86.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="90.0" font-size="11" fill="#898781" text-anchor="end">2,400</text>
<text x="20" y="226" font-size="11" fill="#52514e" text-anchor="middle" transform="rotate(-90 20 226)">latency (µs), log scale</text>
<line x1="78" y1="366" x2="700" y2="366" stroke="#c3c2b7" stroke-width="1"/>
<line x1="78.0" y1="366" x2="78.0" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="78.0" y="386" font-size="11" fill="#898781" text-anchor="middle">0k</text>
<line x1="219.4" y1="366" x2="219.4" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="219.4" y="386" font-size="11" fill="#898781" text-anchor="middle">25k</text>
<line x1="360.7" y1="366" x2="360.7" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="360.7" y="386" font-size="11" fill="#898781" text-anchor="middle">50k</text>
<line x1="502.1" y1="366" x2="502.1" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="502.1" y="386" font-size="11" fill="#898781" text-anchor="middle">75k</text>
<line x1="643.5" y1="366" x2="643.5" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="643.5" y="386" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<text x="389" y="410" font-size="11" fill="#52514e" text-anchor="middle">offered rate (requests/sec)</text>
