<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="braft — the tail breaks first, at 70k">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">braft — the tail breaks first, at 70k</text>
<text x="78" y="46" font-size="12" fill="#52514e">p99 leaves p50 at 70k and is 10x its floor by 100k. Its rise below 35k is the arrival shape, not braft.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
