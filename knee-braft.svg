<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">braft — flat to 250k on c7a, then a cliff</text>
<text x="78" y="46" font-size="12" fill="#52514e">p50 641us at 10k to 1291us at 250k; 280k collapses. Earlier c6i fleet turned at ~160k.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
