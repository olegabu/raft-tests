<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="Flat, then a knee: three raft implementations under open-loop load">
