<text x="78" y="46" font-size="12" fill="#52514e">p50 latency vs offered rate, 3-node multi-AZ cluster on EC2. Log latency scale.</text>
<text x="78" y="62" font-size="12" fill="#52514e">Hollow marker = the cluster no longer kept up with the offered rate.</text>
