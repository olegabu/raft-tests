<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">openraft — still no cliff, but a much lower slope on c7a</text>
<text x="78" y="46" font-size="12" fill="#52514e">Latency never cliffs; the dashed line is where the rig's own drops start climbing.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
