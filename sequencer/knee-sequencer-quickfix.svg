<text x="78" y="46" font-size="12" fill="#52514e">Carries 125k at 1127us, collapses by 175k, plateaus near 158k -- against 250k+ on the hffix arm.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
