<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer-output-brpc — brpc Streaming RPC, clean to 300k">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer-output-brpc — brpc Streaming RPC, clean to 300k</text>
<text x="78" y="46" font-size="12" fill="#52514e">Five client boxes, one gateway, per-client topics. 300k at 1484us with zero drops; collapses by 325k.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="78" y="86" width="179.4" height="280" fill="#f0efec"/>
<text x="86" y="102" font-size="11" fill="#898781">comfort zone</text>
