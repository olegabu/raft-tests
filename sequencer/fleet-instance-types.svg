<svg xmlns="http://www.w3.org/2000/svg" width="940" height="496" viewBox="0 0 940 496" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer ack path across four instance types">
<rect width="940" height="496" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">sequencer ack path across four instance types</text>
<text x="84" y="50" font-size="12" fill="#52514e">p50 vs offered rate, 3-node multi-AZ, identical code and sweep throughout. Log scale.</text>
<text x="84" y="66" font-size="12" fill="#52514e">No instance type broke the ~1 ms floor. c7i reaches the highest rate, c6in the lowest,</text>
<text x="84" y="82" font-size="12" fill="#52514e">and 16 vCPU is no better than 8 - at the knee the raft leader measured 99.6% idle.</text>
<text x="84" y="98" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="84" y="370.3" width="812" height="21.7" fill="#f0efec"/>
<text x="92" y="385.3" font-size="11" fill="#898781">at or below 1 ms</text>
