<line x1="300.1" y1="366" x2="300.1" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="300.1" y="386" font-size="11" fill="#898781" text-anchor="middle">50k</text>
<line x1="411.2" y1="366" x2="411.2" y2="371" stroke="#c3c2b7" stroke-width="1"/>
