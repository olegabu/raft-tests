<text x="68" y="211.7" font-size="11" fill="#898781" text-anchor="end">10,000</text>
<line x1="78" y1="122.6" x2="700" y2="122.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="126.6" font-size="11" fill="#898781" text-anchor="end">50,000</text>
<line x1="78" y1="86.0" x2="700" y2="86.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="90.0" font-size="11" fill="#898781" text-anchor="end">100,000</text>
