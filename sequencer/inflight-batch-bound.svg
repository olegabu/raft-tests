<svg xmlns="http://www.w3.org/2000/svg" width="940" height="516" viewBox="0 0 940 516" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="in-flight batch bound">
<rect width="940" height="516" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Throttling harder at the gateway raises the ceiling</text>
<text x="84" y="50" font-size="12" fill="#52514e">Five input gateways, one leader, 3x c7a.4xlarge + 5x c7a.2xlarge (AMD Genoa), identical</text>
<text x="84" y="66" font-size="12" fill="#52514e">throughout except --max_inflight_batches. The bound is PER GATEWAY, so what the leader sees</text>
<text x="84" y="82" font-size="12" fill="#52514e">is five times it; 5x4 = 20 is near the total concurrency the default 16 was tuned at with one</text>
<text x="84" y="98" font-size="12" fill="#52514e">gateway. Hollow marker = the cluster fell behind the offered rate. Log scale.</text>
<rect x="84" y="379.7" width="812" height="24.3" fill="#f0efec"/>
<text x="92" y="394.7" font-size="11" fill="#898781">at or below 1 ms</text>
