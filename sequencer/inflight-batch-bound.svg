<text x="74" y="383.7" font-size="11" fill="#898781" text-anchor="end">1 ms</text>
<line x1="84" y1="346.8" x2="896" y2="346.8" stroke="#e1e0d9"/>
<text x="74" y="350.8" font-size="11" fill="#898781" text-anchor="end">2 ms</text>
