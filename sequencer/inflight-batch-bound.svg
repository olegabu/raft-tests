<text x="74" y="307.3" font-size="11" fill="#898781" text-anchor="end">5 ms</text>
<line x1="84" y1="237.4" x2="896" y2="237.4" stroke="#e1e0d9"/>
<text x="74" y="241.4" font-size="11" fill="#898781" text-anchor="end">20 ms</text>
<line x1="84" y1="160.9" x2="896" y2="160.9" stroke="#e1e0d9"/>
<text x="74" y="164.9" font-size="11" fill="#898781" text-anchor="end">100 ms</text>
<line x1="84" y1="404" x2="896" y2="404" stroke="#c3c2b7"/>
<line x1="84.0" y1="404" x2="84.0" y2="409" stroke="#c3c2b7"/>
<text x="84.0" y="424" font-size="11" fill="#898781" text-anchor="middle">0k</text>
