<text x="215.0" y="424" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="345.9" y1="404" x2="345.9" y2="409" stroke="#c3c2b7"/>
<text x="345.9" y="424" font-size="11" fill="#898781" text-anchor="middle">200k</text>
<line x1="476.9" y1="404" x2="476.9" y2="409" stroke="#c3c2b7"/>
<text x="476.9" y="424" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="607.9" y1="404" x2="607.9" y2="409" stroke="#c3c2b7"/>
<text x="607.9" y="424" font-size="11" fill="#898781" text-anchor="middle">400k</text>
<line x1="738.8" y1="404" x2="738.8" y2="409" stroke="#c3c2b7"/>
<text x="738.8" y="424" font-size="11" fill="#898781" text-anchor="middle">500k</text>
<line x1="869.8" y1="404" x2="869.8" y2="409" stroke="#c3c2b7"/>
<text x="869.8" y="424" font-size="11" fill="#898781" text-anchor="middle">600k</text>
<text x="490" y="446" font-size="11" fill="#52514e" text-anchor="middle">offered rate across the whole fleet (requests/sec)</text>
