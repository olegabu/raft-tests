<line x1="197.6" y1="366" x2="197.6" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="197.6" y="386" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="317.2" y1="366" x2="317.2" y2="371" stroke="#c3c2b7" stroke-width="1"/>
