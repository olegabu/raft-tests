<svg xmlns="http://www.w3.org/2000/svg" width="940" height="516" viewBox="0 0 940 516" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="knees">
<rect width="940" height="516" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">More client boxes move sequencer&#8217;s knee and leave braft&#8217;s where it was</text>
<text x="84" y="50" font-size="12" fill="#52514e">All three on one fleet: 3x c7a.4xlarge nodes + c7a.2xlarge clients (AMD Genoa), leader</text>
<text x="84" y="66" font-size="12" fill="#52514e">pinned to the node the clients share an AZ and placement group with, 100 sender threads in</text>
<text x="84" y="82" font-size="12" fill="#52514e">total throughout. Multi-client percentiles are merged from every client's raw histogram.</text>
<text x="84" y="98" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate. Log scale.</text>
<rect x="84" y="381.8" width="812" height="38.2" fill="#f0efec"/>
<text x="92" y="396.8" font-size="11" fill="#898781">at or below 1 ms</text>
