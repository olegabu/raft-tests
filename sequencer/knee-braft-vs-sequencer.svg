<text x="845.2" y="440" font-size="11" fill="#898781" text-anchor="middle">450k</text>
<text x="490" y="462" font-size="11" fill="#52514e" text-anchor="middle">offered rate across the whole fleet (requests/sec)</text>
<line x1="434.2" y1="128" x2="434.2" y2="420" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="440.2" y="144" font-size="11" font-weight="600" fill="#52514e" text-anchor="start">braft knee, either way</text>
<line x1="862.2" y1="128" x2="862.2" y2="420" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="856.2" y="160" font-size="11" font-weight="600" fill="#52514e" text-anchor="end">sequencer knee</text>
