<text x="506.9" y="440" font-size="11" fill="#898781" text-anchor="middle">250k</text>
<line x1="591.5" y1="420" x2="591.5" y2="425" stroke="#c3c2b7"/>
<text x="591.5" y="440" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="676.1" y1="420" x2="676.1" y2="425" stroke="#c3c2b7"/>
<text x="676.1" y="440" font-size="11" fill="#898781" text-anchor="middle">350k</text>
