<svg xmlns="http://www.w3.org/2000/svg" width="940" height="496" viewBox="0 0 940 496" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="Aeron regressed on AMD and recovers on Intel">
<rect width="940" height="496" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Aeron regressed on AMD and recovers on Intel</text>
<text x="84" y="50" font-size="12" fill="#52514e">p50 vs offered rate, same Aeron Cluster build and 3-node multi-AZ layout throughout. Log scale.</text>
<text x="84" y="66" font-size="12" fill="#52514e">AMD Genoa steps up at 290k and never recovers; both Intel fleets stay flat past 400k.</text>
<text x="84" y="82" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate.</text>
