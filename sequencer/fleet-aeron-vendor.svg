<line x1="647.9" y1="392" x2="647.9" y2="397" stroke="#c3c2b7"/>
<text x="647.9" y="412" font-size="11" fill="#898781" text-anchor="middle">500k</text>
<line x1="760.7" y1="392" x2="760.7" y2="397" stroke="#c3c2b7"/>
<text x="760.7" y="412" font-size="11" fill="#898781" text-anchor="middle">600k</text>
