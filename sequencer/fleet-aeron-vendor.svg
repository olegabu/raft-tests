<text x="309.6" y="412" font-size="11" fill="#898781" text-anchor="middle">200k</text>
<line x1="422.3" y1="392" x2="422.3" y2="397" stroke="#c3c2b7"/>
<text x="422.3" y="412" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="535.1" y1="392" x2="535.1" y2="397" stroke="#c3c2b7"/>
