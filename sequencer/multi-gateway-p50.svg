<text x="170.4" y="424" font-size="11" fill="#898781" text-anchor="middle">50k</text>
<line x1="256.8" y1="404" x2="256.8" y2="409" stroke="#c3c2b7"/>
<text x="256.8" y="424" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="343.1" y1="404" x2="343.1" y2="409" stroke="#c3c2b7"/>
<text x="343.1" y="424" font-size="11" fill="#898781" text-anchor="middle">150k</text>
<line x1="429.5" y1="404" x2="429.5" y2="409" stroke="#c3c2b7"/>
<text x="429.5" y="424" font-size="11" fill="#898781" text-anchor="middle">200k</text>
<line x1="515.9" y1="404" x2="515.9" y2="409" stroke="#c3c2b7"/>
<text x="515.9" y="424" font-size="11" fill="#898781" text-anchor="middle">250k</text>
<line x1="602.3" y1="404" x2="602.3" y2="409" stroke="#c3c2b7"/>
<text x="602.3" y="424" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="688.7" y1="404" x2="688.7" y2="409" stroke="#c3c2b7"/>
<text x="688.7" y="424" font-size="11" fill="#898781" text-anchor="middle">350k</text>
<line x1="775.1" y1="404" x2="775.1" y2="409" stroke="#c3c2b7"/>
<text x="775.1" y="424" font-size="11" fill="#898781" text-anchor="middle">400k</text>
<line x1="861.4" y1="404" x2="861.4" y2="409" stroke="#c3c2b7"/>
<text x="861.4" y="424" font-size="11" fill="#898781" text-anchor="middle">450k</text>
<text x="490" y="446" font-size="11" fill="#52514e" text-anchor="middle">offered rate across the whole fleet (requests/sec)</text>
<line x1="320.7" y1="128" x2="320.7" y2="404" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="326.7" y="144" font-size="11" font-weight="600" fill="#52514e">1-gateway knee</text>
<line x1="706.0" y1="128" x2="706.0" y2="404" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="712.0" y="160" font-size="11" font-weight="600" fill="#52514e">5-gateway knee</text>
