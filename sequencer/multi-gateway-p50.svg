<text x="185.5" y="424" font-size="11" fill="#898781" text-anchor="middle">50k</text>
<line x1="287.0" y1="404" x2="287.0" y2="409" stroke="#c3c2b7"/>
<text x="287.0" y="424" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="388.5" y1="404" x2="388.5" y2="409" stroke="#c3c2b7"/>
<text x="388.5" y="424" font-size="11" fill="#898781" text-anchor="middle">150k</text>
