<svg xmlns="http://www.w3.org/2000/svg" width="940" height="516" viewBox="0 0 940 516" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="Gateway count moves the knee; node size moves the tail">
<rect width="940" height="516" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Gateway count moves the knee; node size moves the tail</text>
<text x="84" y="50" font-size="12" fill="#52514e">One fleet, one leader (pinned to the node the clients share an AZ and placement group</text>
<text x="84" y="66" font-size="12" fill="#52514e">with), identical rig settings and the same 100 sender threads in total throughout.</text>
<text x="84" y="82" font-size="12" fill="#52514e">Percentiles come from merging every client's raw histogram, not from averaging theirs.</text>
<text x="84" y="98" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="84" y="364.0" width="812" height="40.0" fill="#f0efec"/>
<text x="92" y="379.0" font-size="11" fill="#898781">at or below 1 ms</text>
<line x1="84" y1="393.5" x2="896" y2="393.5" stroke="#e1e0d9"/>
<text x="74" y="397.5" font-size="11" fill="#898781" text-anchor="end">600 µs</text>
<line x1="84" y1="376.9" x2="896" y2="376.9" stroke="#e1e0d9"/>
<text x="74" y="380.9" font-size="11" fill="#898781" text-anchor="end">800 µs</text>
<line x1="84" y1="364.0" x2="896" y2="364.0" stroke="#e1e0d9"/>
<text x="74" y="368.0" font-size="11" fill="#898781" text-anchor="end">1 ms</text>
<line x1="84" y1="324.1" x2="896" y2="324.1" stroke="#e1e0d9"/>
<text x="74" y="328.1" font-size="11" fill="#898781" text-anchor="end">2 ms</text>
<line x1="84" y1="271.3" x2="896" y2="271.3" stroke="#e1e0d9"/>
<text x="74" y="275.3" font-size="11" fill="#898781" text-anchor="end">5 ms</text>
<line x1="84" y1="191.3" x2="896" y2="191.3" stroke="#e1e0d9"/>
<text x="74" y="195.3" font-size="11" fill="#898781" text-anchor="end">20 ms</text>
