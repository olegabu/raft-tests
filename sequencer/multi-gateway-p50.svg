<text x="490.0" y="424" font-size="11" fill="#898781" text-anchor="middle">200k</text>
<line x1="591.5" y1="404" x2="591.5" y2="409" stroke="#c3c2b7"/>
<text x="591.5" y="424" font-size="11" fill="#898781" text-anchor="middle">250k</text>
<line x1="693.0" y1="404" x2="693.0" y2="409" stroke="#c3c2b7"/>
<text x="693.0" y="424" font-size="11" fill="#898781" text-anchor="middle">300k</text>
<line x1="794.5" y1="404" x2="794.5" y2="409" stroke="#c3c2b7"/>
<text x="794.5" y="424" font-size="11" fill="#898781" text-anchor="middle">350k</text>
<line x1="896.0" y1="404" x2="896.0" y2="409" stroke="#c3c2b7"/>
<text x="896.0" y="424" font-size="11" fill="#898781" text-anchor="middle">400k</text>
<text x="490" y="446" font-size="11" fill="#52514e" text-anchor="middle">offered rate across the whole fleet (requests/sec)</text>
<line x1="362.1" y1="128" x2="362.1" y2="404" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="368.1" y="144" font-size="11" font-weight="600" fill="#52514e">1-gateway knee</text>
<line x1="814.8" y1="128" x2="814.8" y2="404" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="820.8" y="160" font-size="11" font-weight="600" fill="#52514e">5-gateway knee</text>
