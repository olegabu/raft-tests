<svg xmlns="http://www.w3.org/2000/svg" width="942" height="406" viewBox="0 0 942 406" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer: three round trips, p50 and p99">
<rect width="942" height="406" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer: three round trips, p50 and p99</text>
<text x="78" y="46" font-size="12" fill="#52514e">Every hop this repo measures, same fleet and same sweep. Identical axes across panels; log latency scale.</text>
<text x="78" y="62" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate. Shaded band = at or below 1 ms.</text>
<text x="78" y="78" font-size="12" fill="#52514e">Past the knee, latency runs to whole seconds; those points clip at the panel top.</text>
