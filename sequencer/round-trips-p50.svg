<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer: every gateway round trip is sub-millisecond at 100k — the ack path is not">
<rect width="900" height="470" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer: every gateway round trip is sub-millisecond at 100k — the ack path is not</text>
<text x="78" y="46" font-size="12" fill="#52514e">p50 latency vs offered rate, same fleet and sweep as the panels above. Log latency scale.</text>
<text x="78" y="62" font-size="12" fill="#52514e">At 100k: relay 986 µs, output brpc 844 / gRPC 850 / WebSocket 978 µs; synchronous ack 1373 µs.</text>
<text x="78" y="78" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate. Shaded band = at or below 1 ms.</text>
<rect x="78" y="369.6" width="782" height="26.4" fill="#f0efec"/>
<text x="86" y="384.6" font-size="11" fill="#898781">at or below 1 ms</text>
