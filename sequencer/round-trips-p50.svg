<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer: gateway round trips, p50 vs offered rate">
<rect width="900" height="470" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer: gateway round trips, p50 vs offered rate</text>
<text x="78" y="46" font-size="12" fill="#52514e">p50 latency vs offered rate, same fleet and sweep as the panels above. Log latency scale.</text>
<text x="78" y="62" font-size="12" fill="#52514e">At 100k: output: brpc 861 µs; output: gRPC 863 µs; output: WebSocket 854 µs; FIX 4.4 (journal) 1,127 µs; FIX 4.4 (inline) 1,036 µs; braft (raw ops) 793 µs.</text>
<text x="78" y="78" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate. Shaded band = at or below 1 ms.</text>
<rect x="78" y="369.6" width="782" height="26.4" fill="#f0efec"/>
