<rect width="900" height="504" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer: gateway round trips, p50 vs offered rate</text>
<text x="78" y="46" font-size="12" fill="#52514e">p50 latency vs offered rate, same fleet and sweep as the panels above. Log latency scale.</text>
<text x="78" y="62" font-size="12" fill="#52514e">At 100k: output: brpc 846 µs; output: gRPC 825 µs; output: WebSocket 819 µs; FIX 4.4 (journal) 1,055 µs; FIX 4.4</text>
<text x="78" y="78" font-size="12" fill="#52514e">(inline) 1,011 µs; FIX 4.4 (QuickFIX) 982 µs; braft (raw ops) 793 µs.</text>
<text x="78" y="94" font-size="12" fill="#52514e">Hollow marker = the cluster fell behind the offered rate. Shaded band = at or below 1 ms.</text>
