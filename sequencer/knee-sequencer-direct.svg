<text x="317.2" y="386" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="436.8" y1="366" x2="436.8" y2="371" stroke="#c3c2b7" stroke-width="1"/>
<text x="436.8" y="386" font-size="11" fill="#898781" text-anchor="middle">150k</text>
