<line x1="84.0" y1="392" x2="84.0" y2="397" stroke="#c3c2b7"/>
<text x="84.0" y="412" font-size="11" fill="#898781" text-anchor="middle">0k</text>
<line x1="224.0" y1="392" x2="224.0" y2="397" stroke="#c3c2b7"/>
<text x="224.0" y="412" font-size="11" fill="#898781" text-anchor="middle">25k</text>
<line x1="364.0" y1="392" x2="364.0" y2="397" stroke="#c3c2b7"/>
<text x="364.0" y="412" font-size="11" fill="#898781" text-anchor="middle">50k</text>
