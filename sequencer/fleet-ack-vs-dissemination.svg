<text x="504.0" y="412" font-size="11" fill="#898781" text-anchor="middle">75k</text>
<line x1="644.0" y1="392" x2="644.0" y2="397" stroke="#c3c2b7"/>
<text x="644.0" y="412" font-size="11" fill="#898781" text-anchor="middle">100k</text>
<line x1="784.0" y1="392" x2="784.0" y2="397" stroke="#c3c2b7"/>
<text x="784.0" y="412" font-size="11" fill="#898781" text-anchor="middle">125k</text>
<text x="490" y="436" font-size="11" fill="#52514e" text-anchor="middle">offered rate (requests/sec)</text>
<line x1="571.2" y1="128" x2="571.2" y2="392" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="577.2" y="144" font-size="11" font-weight="600" fill="#52514e">crossover</text>
