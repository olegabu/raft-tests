<svg xmlns="http://www.w3.org/2000/svg" width="940" height="496" viewBox="0 0 940 496" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="Ack vs dissemination, measured in the same runs - they cross over near 85k">
<rect width="940" height="496" fill="#fcfcfb"/>
<text x="84" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Ack vs dissemination, measured in the same runs - they cross over near 85k</text>
<text x="84" y="50" font-size="12" fill="#52514e">c7a.2xlarge (AMD Genoa, 8 vCPU), brpc output gateway. Leader-to-faster-follower RTT 535 us.</text>
<text x="84" y="66" font-size="12" fill="#52514e">Both p50s come from one load-generator run per rate, so this carries no observer-effect confound.</text>
<text x="84" y="82" font-size="12" fill="#52514e">Below ~85k the ack wins: dissemination pays a journal tail plus a hop, and the gateway is unloaded.</text>
<text x="84" y="98" font-size="12" fill="#52514e">Above it the ack pays the loaded gateway twice, inbound and outbound. Both collapse together at 140k.</text>
<rect x="84" y="314.1" width="812" height="77.9" fill="#f0efec"/>
<text x="92" y="329.1" font-size="11" fill="#898781">at or below 1 ms</text>
