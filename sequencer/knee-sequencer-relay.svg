<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer-relay — tracks sequencer's own knee, not a separate ceiling">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer-relay — tracks sequencer's own knee, not a separate ceiling</text>
<text x="78" y="46" font-size="12" fill="#52514e">p50 flat 3-5ms from 10k to 115k; the cliff at 130k lands where phase 1's own knee already was.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
