<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family='system-ui,-apple-system,"Segoe UI",sans-serif' role="img" aria-label="sequencer-fix-inline - FIX 4.4, answered from the propose receipt">
<rect width="820" height="440" fill="#fcfcfb"/>
<text x="78" y="28" font-size="16" font-weight="600" fill="#0b0b0b">sequencer-fix-inline - FIX 4.4, answered from the propose receipt</text>
<text x="78" y="46" font-size="12" fill="#52514e">Faster below ~100k and worse above, and it knees at 300k where the journal path runs to 400k: one send per reply, uncoalesced.</text>
<text x="78" y="62" font-size="12" fill="#52514e">p50 and p99 latency, open loop. Hollow marker = the cluster fell behind the offered rate.</text>
<rect x="78" y="86" width="89.7" height="280" fill="#f0efec"/>
<text x="86" y="102" font-size="11" fill="#898781">comfort zone</text>
<line x1="451.2" y1="86" x2="451.2" y2="366" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/>
<text x="457.2" y="102" font-size="11" font-weight="600" fill="#52514e">knee</text>
<line x1="78" y1="366.0" x2="700" y2="366.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="370.0" font-size="11" fill="#898781" text-anchor="end">500</text>
<line x1="78" y1="333.6" x2="700" y2="333.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="337.6" font-size="11" fill="#898781" text-anchor="end">1,000</text>
