<text x="442.8" y="236" font-size="11" font-weight="600" fill="#52514e">last clean</text>
<line x1="78" y1="358.6" x2="700" y2="358.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="362.6" font-size="11" fill="#898781" text-anchor="end">700</text>
<line x1="78" y1="341.4" x2="700" y2="341.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="345.4" font-size="11" fill="#898781" text-anchor="end">1,000</text>
<line x1="78" y1="308.0" x2="700" y2="308.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="312.0" font-size="11" fill="#898781" text-anchor="end">2,000</text>
