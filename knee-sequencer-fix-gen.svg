<text x="68" y="214.9" font-size="11" fill="#898781" text-anchor="end">15,000</text>
<line x1="78" y1="152.8" x2="700" y2="152.8" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="156.8" font-size="11" fill="#898781" text-anchor="end">50,000</text>
<line x1="78" y1="99.9" x2="700" y2="99.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="68" y="103.9" font-size="11" fill="#898781" text-anchor="end">150,000</text>
